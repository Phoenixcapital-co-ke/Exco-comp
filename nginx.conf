# Nginx configuration for Exco Dashboard
# Place this in your nginx installation directory (usually C:\nginx\conf\nginx.conf)
# Or include it in your main nginx.conf with: include /path/to/this/file;

# Upstream backend server
upstream exco_backend {
    server localhost:3001;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name phoenixcapital.nyamao.me;
    
    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root C:/nginx/html;
    }
    
    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name phoenixcapital.nyamao.me;
    
    # SSL Certificate paths (update these with your actual certificate paths)
    ssl_certificate C:/nginx/ssl/phoenixcapital.nyamao.me.crt;
    ssl_certificate_key C:/nginx/ssl/phoenixcapital.nyamao.me.key;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log C:/nginx/logs/exco_access.log;
    error_log C:/nginx/logs/exco_error.log;
    
    # Maximum upload size
    client_max_body_size 10M;
    
    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Reverse proxy to Node.js backend
    location / {
        proxy_pass http://exco_backend;
        proxy_redirect off;
    }
    
    # Server-Sent Events (SSE) support
    location /api/events {
        proxy_pass http://exco_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
    
    # API endpoints
    location /api/ {
        proxy_pass http://exco_backend;
    }
}

